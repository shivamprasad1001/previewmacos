name: Build Multiplatform Installers (Linux & Windows)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-linux-deb:
    name: Build Linux .deb Package
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libgl1 libegl1
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run Tests
        env:
          QT_QPA_PLATFORM: offscreen
          CI: "true"
          PREVIEW_TESTING: "true"
        run: |
          python -m unittest test_studio_ui.py test_icons.py test_preview_features.py

      - name: Build Debian Package (.deb)
        run: |
          chmod +x build_deb.sh
          ./build_deb.sh

      - name: Verify .deb in Clean Debian 13 Container
        run: |
          docker run --rm -v "${{ github.workspace }}/dist:/pkg" debian:13 bash -c "
            set -e
            apt-get update
            apt-get install -y /pkg/*.deb
            echo '=== Checking for missing libraries in Debian 13 ==='
            find /usr/lib/preview-app -name '*.so*' -exec ldd {} \; 2>/dev/null | grep 'not found' | sort -u || echo 'All shared libraries resolved!'
            echo '=== Headless launch test in Debian 13 ==='
            QT_QPA_PLATFORM=offscreen timeout 5s /usr/lib/preview-app/preview-app || [ \$? -eq 124 ]
            echo 'Debian 13 verification PASS!'
          "

      - name: Verify .deb in Clean Debian 12 Container
        run: |
          docker run --rm -v "${{ github.workspace }}/dist:/pkg" debian:12 bash -c "
            set -e
            apt-get update
            apt-get install -y /pkg/*.deb
            echo '=== Checking for missing libraries in Debian 12 ==='
            find /usr/lib/preview-app -name '*.so*' -exec ldd {} \; 2>/dev/null | grep 'not found' | sort -u || echo 'All shared libraries resolved!'
            echo '=== Headless launch test in Debian 12 ==='
            QT_QPA_PLATFORM=offscreen timeout 5s /usr/lib/preview-app/preview-app || [ \$? -eq 124 ]
            echo 'Debian 12 verification PASS!'
          "

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-linux-deb
          path: dist/*.deb

  build-windows-exe:
    name: Build Windows Setup Installer
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Build Standalone Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name="Preview" --icon="preview/assets/icon.ico" --add-data "preview/assets;preview/assets" --collect-all pymupdf --hidden-import fitz --hidden-import pymupdf main.py

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: windows/setup.iss

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-windows-setup
          path: dist/*Setup*.exe

  release:
    name: Publish Release Assets
    needs: [build-linux-deb, build-windows-exe]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: preview-linux-deb
          path: release_assets/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: preview-windows-setup
          path: release_assets/

      - name: Generate Release Checksums
        run: |
          cd release_assets
          sha256sum *.deb *.exe > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
