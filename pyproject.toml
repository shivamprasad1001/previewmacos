[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "previewmacos"
version = "1.7.3"
description = "macOS Preview document and image viewer for Linux and Windows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.4.0",
    "pymupdf>=1.24.0,<2.0.0",
    "pillow>=10.0.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    # Entrypoint, screenshot scripts, and tests configure sys.path / QT_QPA_PLATFORM before importing preview.*
    "E402",
    # Existing QSS stylesheets and HTML templates contain long lines; avoid repo-wide reformatting churn
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Package __init__.py files intentionally re-export public symbols
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false
check_untyped_defs = false
warn_return_any = false
